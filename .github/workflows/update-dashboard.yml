name: Atualizar Dashboard

on:
  schedule:
    - cron: '0 * * * *'   # de hora a hora
  workflow_dispatch: {}    # botão "Run workflow" manual no separador Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Buscar dados
        env:
          SHOPIFY_TOKEN_ARANY_LUNA: ${{ secrets.SHOPIFY_TOKEN_ARANY_LUNA }}
          FLYWEEL_KEY_ARANY_LUNA: ${{ secrets.FLYWEEL_KEY_ARANY_LUNA }}
        run: node scripts/fetch-data.js

      - name: Commit data.json
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Atualizar dados do dashboard"
          git push
