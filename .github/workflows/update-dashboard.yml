name: Atualizar Dashboard

on:
  schedule:
    - cron: '*/5 * * * *'   # de 5 em 5 minutos (mínimo permitido pelo GitHub)
  workflow_dispatch: {}    # botão "Run workflow" manual no separador Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Buscar dados
        env:
          SHOPIFY_CLIENT_ID_ARANY_LUNA: ${{ secrets.SHOPIFY_CLIENT_ID_ARANY_LUNA }}
          SHOPIFY_CLIENT_SECRET_ARANY_LUNA: ${{ secrets.SHOPIFY_CLIENT_SECRET_ARANY_LUNA }}
          FLYWEEL_KEY_ARANY_LUNA: ${{ secrets.FLYWEEL_KEY_ARANY_LUNA }}
          # ao adicionares uma loja nova, acrescenta aqui as três linhas
          # correspondentes: SHOPIFY_CLIENT_ID_<ID>, SHOPIFY_CLIENT_SECRET_<ID> e FLYWEEL_KEY_<ID>
        run: node scripts/fetch-data.js

      - name: Commit data.json
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Atualizar dados do dashboard"
          git push
